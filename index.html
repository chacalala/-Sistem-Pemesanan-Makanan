<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Home</title>
    <style>
        /* CSS */
        body {
            font-family: 'Courier New', Courier, monospace;
            background-image: url('asset/image/banner-background-image.jpg');
            background-size: cover; 
            background-attachment: fixed;
            margin: 0;
            padding: 0;
        }

        .menu ul {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .menu li {
            display: inline-block;
            margin-left: 20px;
        }
        .menu .in a {
            background-color: grey;
            border-radius: 5px;
        }

        .menu a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: color 0.3s, background-color 0.3s;
            padding: 10px 20px;
            border-radius: 5px;
            border: 2px solid transparent;
        }

        .menu a:hover {
            background-color: #3f3f3f;
            border-color: #fff;
        }

        .content {
            color: whitesmoke;
            text-align: center;
            font-size: 20px;
            padding: 20px;
            border-radius: 5px;
            width: 60%;
            max-width: 600px;
            margin: 160px auto 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .content h1 {
            font-size: 36px;
            margin-bottom: 40px;
            font-family: 'Lucida Handwriting', cursive;
        }

        .content .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .content a.kanan,
        .content a.kiri{
            padding: 15px 30px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            transition: background-color 0.3s, transform 0.3s;
            border: 2px solid transparent;
        }
        .content a.bawah {
            font-size: 24px; /* Ubah ukuran teks sesuai kebutuhan */
            font-weight: bold; /* Atur teks menjadi tebal */
        }

        .content a.kanan:hover,
        .content a.kiri:hover{
            background-color: #fff;
            color: #000;
            border-color: #fff;
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            /* Styles for tablets */
            .content {
                width: 80%;
            }
        }

        @media (max-width: 425px) {
            /* Styles for mobile phones */
            .content {
                width: 90%;
                margin-top: 120px;
            }

            .content h1 {
                font-size: 28px;
                margin-bottom: 20px;
                padding-top: 20px;
            }

            .menu li {
                display: block;
                margin: 10px 0;
            }
            
            .body {
                background-attachment: scroll;
                background-size: contain;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Welcome in Tasty Treats</h1>
        <div class="links-container">
            <a class="kanan" href="asset/order.php">Order Sekarang</a>
            <a class="kiri" href="asset/selectqr.php">Order Dengan QR CODE</a>
            <a class="bawah" onclick="window.location.href = 'login.php'">Login</a>
        </div>
    </div>
</body>
</html>
